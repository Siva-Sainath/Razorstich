# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect repo → Blueprint path: render.yaml (or leave blank)
services:
  - type: web
    name: razorstitch-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/agents
    # Free tier: no persistent disk — leads/payment_orders JSON in data/ are ephemeral
    # (lost on redeploy). Upgrade to Starter + add a disk block if you need persistence.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
