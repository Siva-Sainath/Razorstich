# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect repo → Blueprint path: render.yaml (or leave blank)
services:
  - type: web
    name: razorstitch-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/agents
    # Pilot leads + payment orders persist across deploys (optional on free tier)
    disk:
      name: razorstitch-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
